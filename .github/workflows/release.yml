name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine tag and semver
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: macOS (Universal DMG)
    needs: meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build Apple Silicon and Intel release binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package Gophie.app and create DMG
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          APP_DIR="dist/Gophie.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"

          lipo -create \
            target/aarch64-apple-darwin/release/gophie \
            target/x86_64-apple-darwin/release/gophie \
            -output "${APP_DIR}/Contents/MacOS/Gophie"
          chmod +x "${APP_DIR}/Contents/MacOS/Gophie"

          cp packaging/macos/Gophie.icns "${APP_DIR}/Contents/Resources/Gophie.icns"

          cat > "${APP_DIR}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Gophie</string>
            <key>CFBundleDisplayName</key>
            <string>Gophie</string>
            <key>CFBundleIdentifier</key>
            <string>org.gophie.Gophie</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>Gophie</string>
            <key>CFBundleIconFile</key>
            <string>Gophie</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key>
                <string>Gopher URL</string>
                <key>CFBundleURLSchemes</key>
                <array>
                  <string>gopher</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - "${APP_DIR}"

          DMG_STAGE="dist/dmg-stage"
          mkdir -p "${DMG_STAGE}"
          cp -R "${APP_DIR}" "${DMG_STAGE}/"
          ln -s /Applications "${DMG_STAGE}/Applications"

          hdiutil create \
            -volname "Gophie" \
            -srcfolder "${DMG_STAGE}" \
            -ov -format UDZO \
            "dist/Gophie-${VERSION}-macos-universal.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  build-windows:
    name: Windows (${{ matrix.arch }} ZIP)
    needs: meta
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}

      - name: Build self-contained Windows binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Gophie.exe into ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          $stage = "dist/windows-$env:ARCH"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/gophie.exe" "$stage/Gophie.exe"
          Copy-Item "LICENSE" "$stage/LICENSE"
          Copy-Item "README.md" "$stage/README.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Gophie-$env:VERSION-windows-$env:ARCH.zip" -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-zip
          path: dist/*.zip

  build-linux:
    name: Linux (DEB & RPM)
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Linux release binary
        run: cargo build --release

      - name: Install nfpm
        run: |
          NFPM_VERSION="2.41.1"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build DEB and RPM packages
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          nfpm package --config packaging/linux/nfpm.yaml --packager deb --target "dist/Gophie-${VERSION}-linux-amd64.deb"
          nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target "dist/Gophie-${VERSION}-linux-x86_64.rpm"

      - name: Upload Linux DEB and RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  release:
    name: Publish GitHub Release
    needs: [meta, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Gophie ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
